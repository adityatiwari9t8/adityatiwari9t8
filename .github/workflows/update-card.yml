name: Update ASCII profile card

on:
  schedule:
    # Daily. The card shows "Uptime" in days, so it changes every day.
    # Switch to weekly (e.g. "17 3 * * 1") if you want fewer commits.
    - cron: "17 3 * * *"
  # Also refresh whenever this workflow file changes on main (same idea as the
  # Andrew6rant README build, which runs on push + daily cron).
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-card.yml"
  workflow_dispatch:

# Only one run at a time; a newer run replaces a queued one.
concurrency:
  group: update-ascii-card
  cancel-in-progress: false

permissions:
  contents: write

env:
  # gh-ascii hosted generator (from the repo's About link).
  CARD_BASE_URL: https://gh.crafter.run

jobs:
  update-card:
    runs-on: ubuntu-latest
    # Only run in the profile repo (<user>/<user>), never in forks or other repos.
    if: github.repository == format('{0}/{0}', github.repository_owner)
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download fresh cards
        env:
          HANDLE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cards"

          for theme in dark light; do
            out="$RUNNER_TEMP/cards/${theme}_mode.svg"

            curl -fsSL \
              --retry 4 --retry-delay 15 --retry-all-errors \
              --max-time 180 \
              -H "Accept: image/svg+xml" \
              "${CARD_BASE_URL}/${HANDLE}?theme=${theme}" \
              -o "$out"

            # Sanity checks so an error page or empty body never replaces a good card.
            size=$(wc -c < "$out")
            if [ "$size" -lt 5000 ]; then
              echo "::error::${theme} card is only ${size} bytes, refusing to use it"
              exit 1
            fi
            if ! head -c 400 "$out" | grep -q "<svg"; then
              echo "::error::${theme} card does not start with an <svg> element"
              exit 1
            fi
            if ! tail -c 200 "$out" | grep -q "</svg>"; then
              echo "::error::${theme} card is truncated (no closing </svg>)"
              exit 1
            fi
            if ! grep -q "$HANDLE" "$out"; then
              echo "::error::${theme} card does not mention ${HANDLE}"
              exit 1
            fi
          done

          cp "$RUNNER_TEMP/cards/dark_mode.svg"  dark_mode.svg
          cp "$RUNNER_TEMP/cards/light_mode.svg" light_mode.svg

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: refresh ASCII profile card"
          git push
